# Testlauf fuer jeden Push und jeden Pull Request.
#
# Die Suite braucht ein PostgreSQL mit pgvector: die Tests zu Mandantentrennung
# und Migrationen laufen gegen eine echte Datenbank und wuerden sonst still
# uebersprungen - also genau die Tests, die am meisten absichern.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # Dasselbe Image wie in docker-compose.yml - pgvector ist mit drin.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          # Nur fuer diesen Lauf, erreichbar allein im Job-Netz.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mailagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # In CI verbindet auch die Anwendung als Owner. Die RLS-Tests legen sich
      # ihre eigene Rolle ohne Superuser-Rechte an (siehe tests/conftest.py) -
      # nur so wuerde eine kaputte Mandantentrennung ueberhaupt auffallen.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mailagent
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mailagent
      # Die Tests ersetzen Extraktion und Embeddings durch eigene Funktionen
      # (tests/fakes.py) - es geht kein einziger Aufruf zu OpenAI raus.
      OPENAI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Wie im Dockerfile, damit CI dieselbe Version testet, die auch laeuft.
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        # -rs listet uebersprungene Tests mit Grund auf: fehlt die Datenbank,
        # soll das im Protokoll stehen und nicht als gruener Lauf durchgehen.
        run: pytest -q -rs
